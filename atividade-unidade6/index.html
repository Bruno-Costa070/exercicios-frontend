<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.JS</title>
    <style>
        body{
            margin: 20px;
            font-family: Arial;
            display: flex;
            justify-content: center;
        }
        .container{
            max-width: 500px;
            margin: 0 auto;
        }

        .formulario input{
            width: 350px;
            height: 30px;
            padding: 10px;
            background-color: #ddd5d5;
            border-radius: 7px;
            border: 2px solid #000000;
        }
        .formulario textarea{
            width: 350px;
            height: 30px;
            padding: 10px;
            background-color: #ddd5d5;
            border-radius: 7px;
            border: 2px solid #000000;
        }
        .card{
            background-color: #f4f4f4;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
    <script src="http://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>

    <div id="app">
        <div class="container">
            <comment-form @add-comentario="ComentarioSalvo"></comment-form>

            <comment-list :comentarios="comentarios"></comment-list>
        </div>   
    </div>

    <script>
        Vue.component('comment-list', {
            props: ['comentarios'],
            template: `<div class="Lista">
                <div class="lista-comentarios">
                    <div class="card" v-for="comentario in comentarios">
                        <p><strong>{{comentario.nome}}</strong></p>
                        <p>{{comentario.texto}}</p>
                    </div>
                </div>
            </div>`,
        });

        Vue.component('comment-form', {
            template: `<div class="formulario">
                <h1>Formulário</h1>
                <p>
                    <input type="text" name="usuário" placeholder="Digite seu nome" v-model="nome">
                </p>

                <p>
                    <textarea placeholder="Digite seu comentário" v-model="comentario"></textarea>
                </p>

                <button @click="adicionarComentario">Comentar</button>
            </div>`,

            data() {
                return {
                    nome: '',
                    comentario: '',
                }
            },
            
            methods: {
                adicionarComentario() {
                    this.$emit('add-comentario', {
                        nome: this.nome,
                        texto: this.comentario,
                    });

                    this.nome = '';
                    this.comentario = '';
                }
            }
            
        });

        new Vue ({
            el: '#app',
            data() {
                return{
                    comentarios: [],
                }
            
            },

            methods: {
                ComentarioSalvo(novoComentario) {
                    this.comentarios.push(novoComentario);
                }
            }
        });
    </script>
</body>
</html>
