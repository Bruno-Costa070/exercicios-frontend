<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout em Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 0.4fr 1fr;
            height: 500px;
            width: 500px;
            border: 2px solid black;
            padding: 10px;
            box-sizing: border-box;
            gap: 15px;
        }
        .bloco1{
            background-color: #a254eb;
            color: aliceblue;
        }
        .bloco2{
            background-color: #547ceb;
            color: aliceblue;
        }
        .bloco3{
            background-color: #ebc806;
            color: aliceblue;
            grid-column: 2;
            height: 150px;
            align-self: end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bloco1"> Bloco Superior Esquerdo</div>
        <div class="bloco2">Bloco Superior Direito</div>
        <div class="bloco3">Bloco Inferior Direito</div>
    </div>
</body>
</html>
