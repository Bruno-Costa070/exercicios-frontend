<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="saida">Saída</h1>

    <script>
        var pessoa = {
            nome: 'joão',
            idade: '42',
            cidade: 'Parnamirim',
            saudacao: function() {
            return `Olá, meu nome é ${this.nome}, tenho ${this.idade} e moro em ${this.cidade}`
            }
        };
        var saida = document.getElementById('saida');
        saida.innerHTML = pessoa.saudacao();
    </script>
</body>
</html>
